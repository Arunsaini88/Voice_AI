# Local production-like stack: backend on :8000, frontend on :8080.
#   docker compose up --build
# Backend secrets come from voice-notes-backend/.env (copy .env.example).
# The frontend origin is injected into CORS so the two can talk.
services:
  backend:
    build: ./voice-notes-backend
    env_file: ./voice-notes-backend/.env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./voice-notes-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
